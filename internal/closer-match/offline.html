<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Offline · Nikash</title>
<meta name="theme-color" content="#F7F5F2">
<!--
  Shown by sw.js when a staff page cannot be reached. Self-contained on purpose:
  no stylesheet, no script, no font, nothing that would itself need the network
  that is missing. Nikash has nothing useful to show offline — every screen is
  live data — so this says that plainly instead of the browser's own error.
-->
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    background: #F7F5F2; color: #17171A;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
  }
  @media (prefers-color-scheme: dark) { body { background: #141414; color: #ECEAE6; } }
  main { max-width: 340px; text-align: center; }
  h1 { font-size: 22px; margin: 18px 0 6px; letter-spacing: -0.02em; }
  p { margin: 0 0 22px; opacity: 0.72; }
  button {
    font: inherit; font-weight: 600; padding: 12px 22px; min-height: 44px;
    border-radius: 6px; border: 1px solid currentColor; background: none; color: inherit;
  }
  svg { width: 56px; height: 56px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 32 32" aria-hidden="true"><g transform="rotate(-8 16 16)">
    <path fill="#141416" d="M 3.8 15.4 C 3.3 9.6 8.6 4.2 15.9 3.7 C 23.0 3.2 28.6 7.0 28.8 13.2 C 29.0 18.6 25.8 23.9 20.5 26.4 C 16.6 28.2 10.4 28.0 7.0 25.0 C 4.8 23.0 4.0 19.2 3.8 15.4 Z"/>
    <path fill="#FF4D00" d="M 8.87 20.24 L 24.85 7.73 A 1.15 1.15 0 0 1 26.35 9.47 L 11.53 23.36 A 2.05 2.05 0 0 1 8.87 20.24 Z"/>
  </g></svg>
  <h1>You're offline</h1>
  <p>Nikash reads everything live, so it needs a connection. Nothing you had
     already saved is lost — interview answers are written the moment you score them.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
