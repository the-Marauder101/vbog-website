<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Nikash">
  <!-- NIKASH — निकष, the touchstone: a black stone you rub gold against to read
       its purity. The mark is the stone, and the streak the gold leaves on it.

       Three decisions carry the whole thing:

       · THE STREAK TAPERS. It is drawn as a filled path, wide where the metal
         first bites and narrow where it lifts, because a constant-width
         diagonal reads as a slash THROUGH the stone. This tool reveals what
         the metal is; it does not cut anything.
       · THE STREAK LEAVES THE STONE. Its narrow end crosses the edge and
         continues. The reading does not stay on the instrument.
       · THE STONE IS NOT A ROUNDED SQUARE. An irregular silhouette with a
         flatter base reads as an object resting on a surface. A rounded square
         reads as an app icon, which is what the first draft did.

       Tilted 9° for the same reason. Sized so the rotated extremes stay inside
       the 32-unit box, and verified legible down to 16px.

       Structural sibling to img/vyom.svg — a world and its orbit for व्योम,
       a stone and its streak for निकष. Each VBOG tool is its own name, drawn.
       Different palette on purpose: Vyom is navy and cyan, Nikash is ink and
       V-BOG orange. -->
  <style>
    /* On a dark ground an ink stone loses its edge; a rim gives it back.
       Invisible in light mode, where the paper already provides the contrast. */
    .rim { stroke: none; }
    @media (prefers-color-scheme: dark) {
      .rim { stroke: #37373F; stroke-width: 0.9; }
    }
  </style>
  <g transform="rotate(-8 16 16)">
    <path class="rim" fill="#141416"
          d="M 3.8 15.4 C 3.3 9.6 8.6 4.2 15.9 3.7 C 23.0 3.2 28.6 7.0 28.8 13.2
             C 29.0 18.6 25.8 23.9 20.5 26.4 C 16.6 28.2 10.4 28.0 7.0 25.0
             C 4.8 23.0 4.0 19.2 3.8 15.4 Z"/>
    <!-- polished edge -->
    <path d="M 7.0 10.8 C 9.1 7.4 12.2 5.4 16.0 4.9"
          fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity=".12"/>
    <!-- the rub: half-width 2.05 at the bite, 1.15 as it lifts and leaves the stone -->
    <path fill="#FF4D00"
          d="M 8.87 20.24 L 24.85 7.73 A 1.15 1.15 0 0 1 26.35 9.47
             L 11.53 23.36 A 2.05 2.05 0 0 1 8.87 20.24 Z"/>
  </g>
</svg>
