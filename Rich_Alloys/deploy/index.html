<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Rich Alloys has moved</title>
  <meta http-equiv="refresh" content="0; url=https://rich.v-bog.com/" />
  <script>
    // keep the screen the person was on (#/lot/...), and clear the old installed app's cache
    if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
    if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
    location.replace("https://rich.v-bog.com/" + location.hash);
  </script>
  <style>body{font-family:system-ui,sans-serif;background:#f6f1e7;color:#1f1b16;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px;text-align:center}a{color:#a8541e}</style>
</head>
<body>
  <p>Rich Alloys has moved to <a href="https://rich.v-bog.com/">rich.v-bog.com</a>.<br />If you installed the app, remove the old icon and add it again from the new address.</p>
</body>
</html>
