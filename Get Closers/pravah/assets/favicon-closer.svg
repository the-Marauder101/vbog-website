<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Pravah Closer Portal">
  <!-- Closer Portal: the bolt — a single jagged stream cutting
       through the pool. Personal energy, direct action, no detours.
       The closer doesn't meander; they strike. Violet-to-purple. -->
  <defs>
    <linearGradient id="pg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-7 16 16)">
    <path fill="url(#pg)"
          d="M 14.5 3.8 C 21 2.8, 28.2 7.5, 28.5 14.8
             C 28.8 21.6, 24 27.8, 17.5 28.2
             C 11.5 28.5, 5.8 24.6, 4.2 18.5
             C 2.8 13, 7.5 4.8, 14.5 3.8 Z"/>
    <path d="M 8.5 10 C 11.5 6.8, 16 6.5, 19.5 8.5"
          fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" opacity=".13"/>
    <!-- The bolt: a jagged stream, top-left to bottom-right -->
    <path fill="rgba(255,255,255,0.50)"
          d="M 12 8 L 18 14 L 13 15 L 21 25 L 19 24 L 15 17 L 20 16 L 12 8 Z"/>
  </g>
</svg>
