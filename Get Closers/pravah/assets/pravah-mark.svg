<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Pravah">
  <!-- PRAVAH — प्रवाह, the confluence.

       The main mark holds all five portals. Not as five faint lines —
       as five recognizable fragments of each portal's signature element,
       each in its portal's color, layered inside the shared water body.

       · Ops white S-curve (the current)
       · Performance green chevron (the peak)
       · Revenue orange spiral hint (the funnel)
       · Client blue lens arc (the eye)
       · Closer violet bolt (the strike)

       At 32px they blend into a rich, multi-colored river. At larger
       sizes you start to pick out each element — the family reveals itself. -->
  <style>
    .rim { stroke: none; }
    @media (prefers-color-scheme: dark) {
      .rim { stroke: #37373F; stroke-width: 0.8; }
    }
  </style>
  <defs>
    <linearGradient id="pg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5b2749"/>
      <stop offset="0.6" stop-color="#4a3070"/>
      <stop offset="1" stop-color="#696ff2"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-7 16 16)">
    <path class="rim" fill="url(#pg)"
          d="M 14.5 3.8 C 21 2.8, 28.2 7.5, 28.5 14.8
             C 28.8 21.6, 24 27.8, 17.5 28.2
             C 11.5 28.5, 5.8 24.6, 4.2 18.5
             C 2.8 13, 7.5 4.8, 14.5 3.8 Z"/>
    <!-- Highlight -->
    <path d="M 8.5 10 C 11.5 6.8, 16 6.5, 19.5 8.5"
          fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" opacity=".13"/>
    <!-- Ops: white S-curve — the main current -->
    <path fill="none" stroke="rgba(255,255,255,0.44)" stroke-width="2" stroke-linecap="round"
          d="M 8 13 C 12.5 9, 20 16, 25.5 12.5"/>
    <!-- Performance: green chevron peak, small -->
    <path fill="none" stroke="rgba(59,184,138,0.50)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
          d="M 8.5 20 L 12 15.5 L 15.5 20"/>
    <!-- Revenue: orange spiral arc -->
    <path fill="none" stroke="rgba(255,77,0,0.45)" stroke-width="1.4" stroke-linecap="round"
          d="M 22 13 C 24 16, 22 20, 19 20.5 C 16.5 21, 15.5 19, 16.5 17.5"/>
    <!-- Client: blue lens arc -->
    <path fill="none" stroke="rgba(96,165,250,0.40)" stroke-width="1.2" stroke-linecap="round"
          d="M 10 24 C 14 21, 20 21, 24 24"/>
    <!-- Closer: violet bolt shard -->
    <path fill="rgba(167,139,250,0.35)"
          d="M 21.5 8.5 L 24 12 L 22 12.5 L 24.5 16 L 23.5 15.5 L 22.5 13 L 24 12.5 L 21.5 8.5 Z"/>
  </g>
</svg>
