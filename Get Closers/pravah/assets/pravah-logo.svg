<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-labelledby="title desc">
<title id="title">Pravah by Get Closers</title>
<desc id="desc">Pravah wordmark with the confluence mark — five portal currents meeting in one river.</desc>
<defs>
  <linearGradient id="pg" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#5b2749"/>
    <stop offset="0.6" stop-color="#4a3070"/>
    <stop offset="1" stop-color="#696ff2"/>
  </linearGradient>
  <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".12"/></filter>
</defs>
<g filter="url(#s)" transform="translate(60 95) scale(3.2) rotate(-7)">
  <path fill="url(#pg)"
        d="M 14.5 3.8 C 21 2.8, 28.2 7.5, 28.5 14.8
           C 28.8 21.6, 24 27.8, 17.5 28.2
           C 11.5 28.5, 5.8 24.6, 4.2 18.5
           C 2.8 13, 7.5 4.8, 14.5 3.8 Z"/>
  <path d="M 8.5 10 C 11.5 6.8, 16 6.5, 19.5 8.5"
        fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" opacity=".13"/>
  <!-- Five portal currents converging -->
  <path fill="none" stroke="rgba(255,255,255,0.40)" stroke-width="2" stroke-linecap="round"
        d="M 8 13 C 12.5 8.5, 20 15, 25.5 12"/>
  <path fill="none" stroke="rgba(59,184,138,0.45)" stroke-width="1.4" stroke-linecap="round"
        d="M 7.5 17 C 12 14, 20 19, 25.5 16.5"/>
  <path fill="none" stroke="rgba(255,77,0,0.38)" stroke-width="1.2" stroke-linecap="round"
        d="M 9 20.5 C 13 18, 19 22, 24.5 20"/>
  <path fill="none" stroke="rgba(96,165,250,0.30)" stroke-width="0.9" stroke-linecap="round"
        d="M 11 24 C 14.5 22, 20 25, 23.5 23"/>
  <path fill="none" stroke="rgba(167,139,250,0.25)" stroke-width="0.8" stroke-linecap="round"
        d="M 13 26.5 C 16 25, 20 27, 22 25.5"/>
</g>
<text x="185" y="105" font-family="Inter,Arial,sans-serif" font-size="78" font-weight="700" letter-spacing="-3" fill="#151416">Pravah</text>
<text x="189" y="142" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="4" fill="#706b68">BY GET CLOSERS</text>
</svg>
