<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Pravah Revenue">
  <!-- Revenue: converging currents — lines narrow from wide upstream
       to a focused exit point, like a funnel or pipeline. The flow
       concentrates: leads become cash. Amber-to-orange palette. -->
  <defs>
    <linearGradient id="pg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#ff4d00"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-7 16 16)">
    <path fill="url(#pg)"
          d="M 14.5 3.8 C 21 2.8, 28.2 7.5, 28.5 14.8
             C 28.8 21.6, 24 27.8, 17.5 28.2
             C 11.5 28.5, 5.8 24.6, 4.2 18.5
             C 2.8 13, 7.5 4.8, 14.5 3.8 Z"/>
    <path d="M 8.5 10 C 11.5 6.8, 16 6.5, 19.5 8.5"
          fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" opacity=".13"/>
    <!-- Converging currents: wide entry, narrow exit — the pipeline -->
    <path fill="none" stroke="rgba(255,255,255,0.40)" stroke-width="2" stroke-linecap="round"
          d="M 7 11 C 12 10, 18 13, 24.5 18"/>
    <path fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.6" stroke-linecap="round"
          d="M 8 16 C 13 15.5, 18 17, 23.5 19.5"/>
    <path fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="1.2" stroke-linecap="round"
          d="M 9.5 21 C 14 20, 18 20.5, 22.5 21"/>
    <!-- Focal point: where the funnel converges -->
    <circle cx="24" cy="20" r="1.5" fill="rgba(255,255,255,0.25)"/>
  </g>
</svg>
