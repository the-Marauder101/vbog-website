<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Pravah Revenue">
  <!-- Revenue: the whirlpool — a spiral current drawing inward.
       Lead-to-cash is a vortex: wide at the top, everything
       concentrates toward the center. Amber-to-orange palette. -->
  <defs>
    <linearGradient id="pg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#92400e"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#ff4d00"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-7 16 16)">
    <path fill="url(#pg)"
          d="M 14.5 3.8 C 21 2.8, 28.2 7.5, 28.5 14.8
             C 28.8 21.6, 24 27.8, 17.5 28.2
             C 11.5 28.5, 5.8 24.6, 4.2 18.5
             C 2.8 13, 7.5 4.8, 14.5 3.8 Z"/>
    <path d="M 8.5 10 C 11.5 6.8, 16 6.5, 19.5 8.5"
          fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" opacity=".13"/>
    <!-- The spiral: wide outer loop narrowing to center -->
    <path fill="none" stroke="rgba(255,255,255,0.48)" stroke-width="2.2" stroke-linecap="round"
          d="M 24 12 C 25 17, 22 22, 17 23
             C 12 24, 9 20, 10 16
             C 11 13, 14 12, 16.5 13.5
             C 18 14.5, 17.5 16.5, 16 16.5"/>
    <!-- Center dot: the conversion point -->
    <circle cx="16" cy="16.5" r="1.4" fill="rgba(255,255,255,0.45)"/>
  </g>
</svg>
